[project]
name = "cissn"
version = "0.1.0"
description = "Conformally Calibrated Interpretable State-Space Networks (CISSN)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]
authors = [
    { name = "Emanuele Nardone", email = "emanuele.nardone@unicas.it" }
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CUDA wheels: PyPI's default torch wheel is CPU-only on Windows, which silently
# forces every experiment onto the CPU. Pin the cu128 index (required for
# Blackwell / sm_120 GPUs such as the RTX 50-series).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest",
]
